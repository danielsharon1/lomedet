name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx cap add android
      - name: Icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1f3b34' --iconBackgroundColorDark '#1f3b34' --splashBackgroundColor '#1f3b34' --splashBackgroundColorDark '#1f3b34'
      - name: Portrait, version
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"5.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Sync web app
        run: npx cap sync android
      - name: Use fixed signing key (so updates install over the old version)
        run: mkdir -p ~/.android && cp assets/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon -q
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk lomedet.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.${{ github.run_number }}
          name: לומדת למבחן ${{ github.run_number }}
          body: "להתקנה באנדרואיד: מורידים את lomedet.apk ופותחים אותו בטלפון."
          files: lomedet.apk
          make_latest: true

  web:
    name: Website (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy www to gh-pages
        run: |
          cd www && touch .nojekyll
          git init -q && git checkout -q -b gh-pages && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
